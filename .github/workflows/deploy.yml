name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Google マップのブラウザ用キー（任意）。リポジトリの Secrets に PUBLIC_GMAPS_KEY を
      # 登録するとビルドに埋め込まれ、全利用者の地図が Google になる。
      # 未登録なら空のまま＝地理院タイルで動く。キーは必ずリファラ制限＋割り当て上限を設定すること
      - run: npm run build
        env:
          VITE_PUBLIC_GMAPS_KEY: ${{ secrets.PUBLIC_GMAPS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
